[package]
name = "unified-llsd"
version = "1.0.0"
edition = "2021"
authors = ["Kaleaon"]
description = "Zero-dependency idiomatic native Rust LLSD SDK library"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
