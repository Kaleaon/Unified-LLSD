name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Language Bindings
        run: python3 scripts/generate_bindings.py

      - name: Prepare Artifacts Directory
        run: mkdir -p release-artifacts

      - name: Build C# SDK Package
        run: dotnet pack csharp/Linkpoint.LLSD/Linkpoint.LLSD.csproj -c Release -o release-artifacts

      - name: Build Java / Kotlin Package
        run: |
          chmod +x gradlew
          ./gradlew jar
          cp build/libs/*.jar release-artifacts/

      - name: Build TypeScript Packages
        run: |
          ARTIFACTS_DIR="${GITHUB_WORKSPACE:-$PWD}/release-artifacts"
          cd typescript
          npm install
          npm run build
          npm pack --pack-destination "$ARTIFACTS_DIR"
          cd ../bindings/typescript
          npm install
          npm run build
          npm pack --pack-destination "$ARTIFACTS_DIR"
          cd "${GITHUB_WORKSPACE:-$PWD}"

      - name: Generate Checksums Manifest
        run: |
          cd release-artifacts
          sha256sum * > CHECKSUMS.sha256
          cd ..

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-artifacts/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
