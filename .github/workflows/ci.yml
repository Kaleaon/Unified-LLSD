name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Language Bindings
        run: python3 scripts/generate_bindings.py
      - name: Run Schema Conformance Tests
        run: python3 tests/conformance_test.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'bindings/typescript/package-lock.json'
      - name: Run TypeScript Tests
        run: |
          cd bindings/typescript
          npm install
          npm run test:source

  cpp-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Run C++ Tests
        run: |
          mkdir -p cpp/build
          cd cpp/build
          cmake ..
          cmake --build .
          ./test_llsd
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test --stacktrace

      - name: Verify Protocol Conformance
        run: python3 tools/verify_llsd_conformance.py

  csharp-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: 'csharp/Linkpoint.LLSD/Linkpoint.LLSD.csproj'
      - name: Build C# SDK Package
        run: dotnet build csharp/Linkpoint.LLSD/Linkpoint.LLSD.csproj -c Release
      - name: Run C# SDK Tests
        run: dotnet run --project csharp/Linkpoint.LLSD.Tests/Linkpoint.LLSD.Tests.csproj -c Release

  cpp-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'
      - name: Build C++ SDK
        run: |
          cd cpp
          cmake -B build
          cmake --build build
      - name: Run C++ SDK Tests
        run: |
          cd cpp
          ./build/test_llsd

  rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust SDK Tests
        run: |
          cd rust
          cargo test

  dart-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Run Dart SDK Tests
        run: |
          cd dart
          dart test

  swift-sdk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift SDK Tests
        run: |
          cd swift
          swift test
