exclude: '^(\.dart_tool/|dist/|build/|target/)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: \.(js|ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.56.0
          - typescript@5.3.3
          - "@typescript-eslint/parser@6.21.0"
          - "@typescript-eslint/eslint-plugin@6.21.0"

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: clippy
        args: ["--manifest-path=rust/Cargo.toml", "--", "-D", "warnings"]

  - repo: local
    hooks:
      - id: ktlint
        name: ktlint
        entry: gradle ktlintCheck
        language: system
        types: [kotlin]
        pass_filenames: false

      - id: dotnet-format
        name: dotnet-format
        entry: dotnet format csharp/Linkpoint.LLSD.slnx --verify-no-changes
        language: system
        types: [c#]
        pass_filenames: false
